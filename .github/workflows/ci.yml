name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (multi-core logic)
        run: node tests/unit/core.test.js
      - name: JS syntax check
        run: node --check files/www/luci-static/resources/view/netsteer.js
      - name: Shell syntax check
        run: |
          for f in files/usr/bin/netsteer-* files/etc/init.d/netsteer files/etc/hotplug.d/iface/99-netsteer; do
            sh -n "$f"
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64, mipsel_24kc]
    steps:
      - uses: actions/checkout@v4
      - name: Build .apk (${{ matrix.arch }})
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in [0-9]*) ;; *) V="0.0.0_alpha";; esac
          rm -rf dist          # never ship stale packages from the working tree
          ./scripts/build-apk.sh "$V" ${{ matrix.arch }}
      - name: Verify package integrity (apk verify)
        run: |
          set -e
          TOOLS=$(mktemp -d)
          curl -sL -o "$TOOLS/t.apk" https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/apk-tools-static-3.0.9-r0.apk
          tar xzf "$TOOLS/t.apk" -C "$TOOLS" sbin/apk.static
          chmod +x "$TOOLS/sbin/apk.static"
          "$TOOLS/sbin/apk.static" verify --allow-untrusted dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect artifacts (one dir per arch, no name collisions)
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: false
          path: artifacts
      - name: Flatten into release-dist
        run: |
          set -e
          mkdir -p release-dist
          find artifacts -name '*.apk' -exec cp -n {} release-dist/ \;
          ls -la release-dist/
          # refuse to ship duplicate package names
          DUPES=$(ls release-dist/ | sed -E 's/-[^-]*\.apk$//' | sort | uniq -d || true)
          if [ -n "$DUPES" ]; then echo "ERROR: duplicate package names: $DUPES"; exit 1; fi
      - name: Verify every package before attaching
        run: |
          set -e
          TOOLS=$(mktemp -d)
          curl -sL -o "$TOOLS/t.apk" https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/apk-tools-static-3.0.9-r0.apk
          tar xzf "$TOOLS/t.apk" -C "$TOOLS" sbin/apk.static
          chmod +x "$TOOLS/sbin/apk.static"
          "$TOOLS/sbin/apk.static" verify --allow-untrusted release-dist/*.apk
      - name: Attach all arch builds to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*.apk
          body: |
            Download the .apk matching your device architecture (check `/etc/apk/arch` on the router).

            Install (OpenWrt 24.10+/25.12):
            ```
            apk add --allow-untrusted /tmp/luci-app-netsteer-*.apk
            ```

            Built automatically by CI from this tag — unit tests + 4-arch build matrix.
            Every package is verified with `apk verify` before it is attached.
