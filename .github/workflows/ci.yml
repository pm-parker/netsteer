name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (multi-core logic)
        run: node tests/unit/core.test.js
      - name: JS syntax check
        run: node --check files/www/luci-static/resources/view/netsteer.js
      - name: Shell syntax check
        run: |
          for f in files/usr/bin/netsteer-* files/etc/init.d/netsteer files/etc/hotplug.d/iface/99-netsteer; do
            sh -n "$f"
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64, mipsel_24kc]
    steps:
      - uses: actions/checkout@v4
      - name: Build .apk (${{ matrix.arch }})
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in [0-9]*) ;; *) V="0.0.0-dev";; esac
          ./scripts/build-apk.sh "$V" ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Attach all arch builds to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
