name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (multi-core logic)
        run: node tests/unit/core.test.js
      - name: feed e2e tests (remote data update)
        run: sh tests/unit/feed.test.sh
      - name: JS syntax check
        run: node --check files/www/luci-static/resources/view/netsteer.js
      - name: JS lint (oxlint — unused 归零门禁)
        run: |
          npx -y oxlint@latest files/www/luci-static/resources/view/netsteer.js
          # 门禁: 未使用声明必须归零 (warning 级规则); 其余 warning (block-scoped-var/no-shadow) 不阻断
          if npx -y oxlint@latest files/www/luci-static/resources/view/netsteer.js 2>&1 \
               | grep -qE "no-unused-vars|no-unused-expressions"; then
            echo "::error::unused 声明未清零"
            exit 1
          fi
      - name: Shell syntax check
        run: |
          for f in files/usr/bin/netsteer-* files/etc/init.d/netsteer files/etc/hotplug.d/iface/99-netsteer; do
            sh -n "$f"
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64, mipsel_24kc]
    steps:
      - uses: actions/checkout@v4
      - name: Build .apk (${{ matrix.arch }})
        run: |
          V="${GITHUB_REF_NAME#v}"
          # 仅接受纯版本号 (v1.2.3 → 1.2.3); PR 事件的 "N/merge" 等 ref 一律回退 alpha
          # (旧守卫 [0-9]* 会放行 "1/merge", 斜杠混入 sed 表达式导致构建崩溃)
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) V="0.0.0_alpha";; esac
          rm -rf dist          # never ship stale packages from the working tree
          ./scripts/build-apk.sh "$V" ${{ matrix.arch }}
      - name: Verify package integrity (apk verify)
        run: |
          set -e
          TOOLS=$(mktemp -d)
          curl -sL -o "$TOOLS/t.apk" https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/apk-tools-static-3.0.9-r0.apk
          tar xzf "$TOOLS/t.apk" -C "$TOOLS" sbin/apk.static
          chmod +x "$TOOLS/sbin/apk.static"
          "$TOOLS/sbin/apk.static" verify --allow-untrusted dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4   # release-notes/<tag>.md 需要 (无 checkout 时模板/说明文件不存在)
      - name: Collect artifacts (one dir per arch, no name collisions)
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: false
          path: artifacts
      - name: Flatten into release-dist
        run: |
          set -e
          mkdir -p release-dist
          find artifacts -name '*.apk' -exec cp -n {} release-dist/ \;
          ls -la release-dist/
          # refuse to ship two different packages under the same file name
          DUPES=$(ls release-dist/ | sort | uniq -d || true)
          if [ -n "$DUPES" ]; then echo "ERROR: duplicate file names: $DUPES"; exit 1; fi
          COUNT=$(ls release-dist/*.apk | wc -l)
          echo ">> $COUNT packages collected"
      - name: Verify every package before attaching
        run: |
          set -e
          TOOLS=$(mktemp -d)
          curl -sL -o "$TOOLS/t.apk" https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/apk-tools-static-3.0.9-r0.apk
          tar xzf "$TOOLS/t.apk" -C "$TOOLS" sbin/apk.static
          chmod +x "$TOOLS/sbin/apk.static"
          "$TOOLS/sbin/apk.static" verify --allow-untrusted release-dist/*.apk
      - name: Resolve release notes body
        run: |
          set -e
          # 发版说明双语: release-notes/<tag>.md (中文) + <tag>.en.md (英文, 可选)
          # 拼接顺序: 中文 → 英文 → 安装模板; 缺中文说明只回退模板
          if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
            echo "Using release-notes/${GITHUB_REF_NAME}.md"
            { cat "release-notes/${GITHUB_REF_NAME}.md"; echo; echo "---"; echo; } > /tmp/release-body.md
            if [ -f "release-notes/${GITHUB_REF_NAME}.en.md" ]; then
              echo "Using release-notes/${GITHUB_REF_NAME}.en.md"
              { cat "release-notes/${GITHUB_REF_NAME}.en.md"; echo; echo "---"; echo; } >> /tmp/release-body.md
            else
              echo "WARN: no release-notes/${GITHUB_REF_NAME}.en.md — bilingual body incomplete"
            fi
            cat release-notes/_template.md >> /tmp/release-body.md
          else
            echo "WARN: no release-notes/${GITHUB_REF_NAME}.md — using install template only"
            cp release-notes/_template.md /tmp/release-body.md
          fi
      - name: Attach all arch builds to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*.apk
          body_path: /tmp/release-body.md
