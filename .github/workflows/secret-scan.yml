# 密钥泄露扫描 (gitleaks)
#
# 直接用 gitleaks CLI (版本 + sha256 钉死), 不依赖 gitleaks-action,
# 不需要任何仓库 secret / license。扫描完整 git 历史, 输出已脱敏 (--redact)。
# 发现泄露即失败; 误报可在仓库根目录加 .gitleaksignore (填 finding 的 Fingerprint)。
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 扫描完整历史, 不只是最新提交
      - name: Install gitleaks
        run: |
          set -eu
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan git history
        run: /tmp/gitleaks git --no-banner --redact --verbose .
